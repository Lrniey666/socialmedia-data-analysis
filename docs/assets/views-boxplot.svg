<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="title desc">
  <title id="title">Views on holiday versus other days</title>
  <desc id="desc">Tukey box plots of Hololive official YouTube views in 2022.</desc>
  <style>
    .bg { fill: #f3f6f4; }
    .title { fill: #14201c; font: 700 20px "Segoe UI", "Helvetica Neue", sans-serif; }
    .sub { fill: #5b6b66; font: 400 13px "Segoe UI", "Helvetica Neue", sans-serif; }
    .axis, .label { fill: #14201c; font: 500 13px "Segoe UI", "Helvetica Neue", sans-serif; }
    .muted { fill: #5b6b66; font: 400 12px "Segoe UI", "Helvetica Neue", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121816; }
      .title, .axis, .label { fill: #e8eeea; }
      .sub, .muted { fill: #9aa8a3; }
    }
  </style>
  <rect class="bg" width="700" height="380" rx="20"/>
  <text x="36" y="36" class="title">Hololive official uploads, 2022</text>
  <text x="36" y="56" class="sub">Views · Tukey box (log scale) · holiday = JP ∪ US ∪ ID public calendars</text>
  <line x1="110" y1="310.0" x2="620" y2="310.0" stroke="#e2e8f0"/><text x="100" y="314.0" text-anchor="end" class="axis">50k</text><line x1="110" y1="264.9" x2="620" y2="264.9" stroke="#e2e8f0"/><text x="100" y="268.9" text-anchor="end" class="axis">100k</text><line x1="110" y1="219.8" x2="620" y2="219.8" stroke="#e2e8f0"/><text x="100" y="223.8" text-anchor="end" class="axis">200k</text><line x1="110" y1="160.2" x2="620" y2="160.2" stroke="#e2e8f0"/><text x="100" y="164.2" text-anchor="end" class="axis">500k</text><line x1="110" y1="115.1" x2="620" y2="115.1" stroke="#e2e8f0"/><text x="100" y="119.1" text-anchor="end" class="axis">1M</text><line x1="110" y1="70.0" x2="620" y2="70.0" stroke="#e2e8f0"/><text x="100" y="74.0" text-anchor="end" class="axis">2M</text>
  <line x1="230" y1="125.5" x2="230" y2="286.3" stroke="#14201c" stroke-width="1.6"/><line x1="212" y1="125.5" x2="248" y2="125.5" stroke="#14201c" stroke-width="1.6"/><line x1="212" y1="286.3" x2="248" y2="286.3" stroke="#14201c" stroke-width="1.6"/><rect x="188" y="159.8" width="84" height="56.3" rx="4" fill="#94a3b8" /><line x1="188" y1="196.4" x2="272" y2="196.4" stroke="#f8fafc" stroke-width="3"/><text x="230" y="338" text-anchor="middle" class="label">Non-holiday</text><text x="230" y="356" text-anchor="middle" class="muted">n = 146</text><line x1="470" y1="125.5" x2="470" y2="292.3" stroke="#14201c" stroke-width="1.6"/><line x1="452" y1="125.5" x2="488" y2="125.5" stroke="#14201c" stroke-width="1.6"/><line x1="452" y1="292.3" x2="488" y2="292.3" stroke="#14201c" stroke-width="1.6"/><rect x="428" y="162.1" width="84" height="59.7" rx="4" fill="#0f766e" /><line x1="428" y1="195.9" x2="512" y2="195.9" stroke="#f8fafc" stroke-width="3"/><text x="470" y="338" text-anchor="middle" class="label">Holiday</text><text x="470" y="356" text-anchor="middle" class="muted">n = 51</text>
</svg>
